<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1026" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Glassmorphism Filter -->
    <filter id="glass" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulseRing {
      0% { r: 20px; opacity: 0.8; stroke-width: 2px; }
      50% { opacity: 0.4; }
      100% { r: 180px; opacity: 0; stroke-width: 0.5px; }
    }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateOrbitReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes wavePass {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes blinkStar {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    @keyframes floatDish {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }

    @keyframes signalBeam {
      0% { opacity: 0.2; stroke-dashoffset: 50; }
      50% { opacity: 0.8; }
      100% { opacity: 0.2; stroke-dashoffset: 0; }
    }

    .star { animation: blinkStar 3s infinite ease-in-out; }
    .star-fast { animation: blinkStar 1.5s infinite ease-in-out; }
    .pulse-1 { animation: pulseRing 4s infinite linear; }
    .pulse-2 { animation: pulseRing 4s infinite linear 2s; }
    .orbit-cw { transform-origin: 950px 200px; animation: rotateOrbit 25s infinite linear; }
    .orbit-ccw { transform-origin: 950px 200px; animation: rotateOrbitReverse 35s infinite linear; }
    .dish-float { transform-origin: 200px 260px; animation: floatDish 6s infinite ease-in-out; }
    .beam { stroke-dasharray: 10 5; animation: signalBeam 2s infinite linear; }
  </style>

  <!-- BACKGROUND LAYER -->
  <rect width="1200" height="400" fill="url(#space-bg)" rx="16" />

  <!-- GRID OVERLAY -->
  <g opacity="0.15">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#00f2fe" stroke-width="0.5" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#00f2fe" stroke-width="0.5" />
  </g>

  <!-- BACKGROUND STARS -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" class="star" />
    <circle cx="350" cy="50" r="1" class="star-fast" />
    <circle cx="550" cy="90" r="1.8" class="star" />
    <circle cx="780" cy="60" r="1.2" class="star-fast" />
    <circle cx="1020" cy="100" r="2" class="star" />
    <circle cx="90" cy="320" r="1.5" class="star-fast" />
    <circle cx="420" cy="350" r="1" class="star" />
    <circle cx="680" cy="340" r="1.5" class="star-fast" />
    <circle cx="1130" cy="310" r="1.2" class="star" />
  </g>

  <!-- BACKGROUND DYNAMIC ANIMATED GRAPHICS (Positioned on the Sides/Right to preserve central text clarity) -->
  
  <!-- Right Side: Orbital Node System & Satellite Waves -->
  <g id="orbital-system">
    <!-- Pulse Waves from Ground Station Hub -->
    <circle cx="950" cy="200" r="40" fill="none" stroke="#00f2fe" class="pulse-1" />
    <circle cx="950" cy="200" r="40" fill="none" stroke="#7000ff" class="pulse-2" />

    <!-- Outer Orbit Ellipse 1 -->
    <g class="orbit-cw">
      <ellipse cx="950" cy="200" rx="180" ry="80" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />
      <!-- Satellite 1 -->
      <g transform="translate(1130, 200)">
        <polygon points="0,-6 10,0 0,6 -4,0" fill="#00f2fe" filter="url(#soft-glow)" />
        <rect x="-12" y="-3" width="7" height="6" fill="#4facfe" />
        <rect x="5" y="-3" width="7" height="6" fill="#4facfe" />
      </g>
    </g>

    <!-- Outer Orbit Ellipse 2 (Inclined) -->
    <g class="orbit-ccw" transform="rotate(-30 950 200)">
      <ellipse cx="950" cy="200" rx="210" ry="70" fill="none" stroke="#38ef7d" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
      <!-- Satellite 2 -->
      <g transform="translate(740, 200)">
        <circle r="4" fill="#38ef7d" filter="url(#soft-glow)" />
      </g>
    </g>
    
    <!-- Orbit Center Node -->
    <circle cx="950" cy="200" r="8" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="950" cy="200" r="3" fill="#ffffff" />
  </g>

  <!-- Left Side: Ground Station Antenna Dish Graphic -->
  <g class="dish-float" id="ground-antenna" opacity="0.85">
    <!-- Signal Beam radiating up to right -->
    <line x1="160" y1="210" x2="320" y2="90" stroke="#00f2fe" stroke-width="2" class="beam" filter="url(#soft-glow)" />
    
    <!-- Antenna Base Structure -->
    <path d="M120 310 L160 230 L200 310 Z" fill="none" stroke="#4facfe" stroke-width="2" />
    <line x1="140" y1="270" x2="180" y2="270" stroke="#4facfe" stroke-width="1.5" />
    
    <!-- Dish Reflector Curved Arc -->
    <path d="M120 200 Q 160 240 200 220" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" filter="url(#soft-glow)" />
    <!-- Dish Feed Horn -->
    <line x1="160" y1="220" x2="180" y2="185" stroke="#ffffff" stroke-width="2" />
    <circle cx="180" cy="185" r="3" fill="#38ef7d" filter="url(#soft-glow)" />
  </g>

  <!-- DYNAMIC WAVEFORM DATA TRANSMISSION AT BOTTOM -->
  <path d="M 0 370 Q 150 340 300 370 T 600 370 T 900 370 T 1200 370" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.3" />
  <path d="M 0 375 Q 200 390 400 370 T 800 375 T 1200 370" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2" />

  <!-- FOREGROUND LAYER: FOREGROUND TITLE & SUBTITLE (Guaranteed clear & unobscured) -->
  
  <!-- Central Glassmorphism Backplate for Crisp Readability -->
  <rect x="250" y="70" width="700" height="250" rx="20" fill="#050814" fill-opacity="0.65" stroke="url(#accent-grad)" stroke-width="1.5" filter="url(#soft-glow)" />

  <g text-anchor="middle">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 115)">
      <rect x="-130" y="-16" width="260" height="30" rx="15" fill="#7000ff" fill-opacity="0.3" stroke="#00f2fe" stroke-width="1" />
      <text x="0" y="4" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="2">
        🛰️ SPACE OPS &amp; GSaaS 📡
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="185" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="42" font-weight="900" fill="url(#title-grad)" letter-spacing="1" filter="url(#glow)">
      Awesome Satellite GSaaS
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="230" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#e0e6ed" letter-spacing="0.5">
      Ground Station as a Service &amp; Space Operations Ecosystem
    </text>

    <!-- Subtitle Line 2 / Tech Stack Badges -->
    <text x="600" y="270" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.8">
      CLOUD GSaaS PLATFORMS • MISSION CONTROL • SDR • TELEMETRY • ORBIT TRACKING
    </text>
  </g>
</svg>
