<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><radialGradient id="space-bg" cx="50%" cy="50%" r="75%"><stop offset="0%" stop-color="#0b1026"/><stop offset="50%" stop-color="#050814"/><stop offset="100%" stop-color="#020308"/></radialGradient><linearGradient id="grid-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".1"/><stop offset="50%" stop-color="#4facfe" stop-opacity=".05"/><stop offset="100%" stop-color="#7000ff" stop-opacity=".2"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#fff"/><stop offset="100%" stop-color="#38ef7d"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7000ff"/><stop offset="50%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#00c6ff"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glass" width="100%" height="100%" x="0" y="0"><feGaussianBlur stdDeviation="5"/></filter></defs><style>@keyframes pulseRing{0%{r:20px;opacity:.8;stroke-width:2px}50%{opacity:.4}}@keyframes wavePass{0%{stroke-dashoffset:1000}}@keyframes blinkStar{0%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1.2)}}@keyframes floatDish{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(1deg)}}@keyframes signalBeam{0%{opacity:.2;stroke-dashoffset:50}50%{opacity:.8}}.star{animation:blinkStar 3s infinite ease-in-out}.star-fast{animation:blinkStar 1.5s infinite ease-in-out}.pulse-1{animation:pulseRing 4s infinite linear}.pulse-2{animation:pulseRing 4s infinite linear 2s}.orbit-ccw,.orbit-cw{transform-origin:950px 200px}.orbit-cw{animation:rotateOrbit 25s infinite linear}.orbit-ccw{animation:rotateOrbitReverse 35s infinite linear}.dish-float{transform-origin:200px 260px;animation:floatDish 6s infinite ease-in-out}.beam{stroke-dasharray:10 5;animation:signalBeam 2s infinite linear}</style><rect width="1200" height="400" fill="url(#space-bg)" rx="16"/><g opacity=".15"><path stroke="#00f2fe" stroke-width=".5" d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200"/><path stroke="#00f2fe" stroke-width=".5" d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400"/></g><g fill="#fff"><circle cx="120" cy="80" r="1.5" class="star"/><circle cx="350" cy="50" r="1" class="star-fast"/><circle cx="550" cy="90" r="1.8" class="star"/><circle cx="780" cy="60" r="1.2" class="star-fast"/><circle cx="1020" cy="100" r="2" class="star"/><circle cx="90" cy="320" r="1.5" class="star-fast"/><circle cx="420" cy="350" r="1" class="star"/><circle cx="680" cy="340" r="1.5" class="star-fast"/><circle cx="1130" cy="310" r="1.2" class="star"/></g><g id="orbital-system"><circle cx="950" cy="200" r="40" fill="none" stroke="#00f2fe" class="pulse-1"/><circle cx="950" cy="200" r="40" fill="none" stroke="#7000ff" class="pulse-2"/><g class="orbit-cw"><ellipse cx="950" cy="200" fill="none" stroke="url(#accent-grad)" stroke-dasharray="6 8" stroke-width="1.5" opacity=".6" rx="180" ry="80"/><g transform="translate(1130, 200)"><polygon fill="#00f2fe" points="0 -6 10 0 0 6 -4 0" filter="url(#soft-glow)"/><rect width="7" height="6" x="-12" y="-3" fill="#4facfe"/><rect width="7" height="6" x="5" y="-3" fill="#4facfe"/></g></g><g class="orbit-ccw" transform="rotate(-30 950 200)"><ellipse cx="950" cy="200" fill="none" stroke="#38ef7d" stroke-dasharray="4 6" stroke-width="1" opacity=".4" rx="210" ry="70"/><g transform="translate(740, 200)"><circle r="4" fill="#38ef7d" filter="url(#soft-glow)"/></g></g><circle cx="950" cy="200" r="8" fill="#00f2fe" filter="url(#glow)"/><circle cx="950" cy="200" r="3" fill="#fff"/></g><g id="ground-antenna" class="dish-float" opacity=".85"><line x1="160" x2="320" y1="210" y2="90" stroke="#00f2fe" stroke-width="2" class="beam" filter="url(#soft-glow)"/><path fill="none" stroke="#4facfe" stroke-width="2" d="M120 310 L160 230 L200 310 Z"/><line x1="140" x2="180" y1="270" y2="270" stroke="#4facfe" stroke-width="1.5"/><path fill="none" stroke="#00f2fe" stroke-linecap="round" stroke-width="5" d="M120 200 Q 160 240 200 220" filter="url(#soft-glow)"/><line x1="160" x2="180" y1="220" y2="185" stroke="#fff" stroke-width="2"/><circle cx="180" cy="185" r="3" fill="#38ef7d" filter="url(#soft-glow)"/></g><path fill="none" stroke="url(#accent-grad)" stroke-width="1.5" d="M 0 370 Q 150 340 300 370 T 600 370 T 900 370 T 1200 370" opacity=".3"/><path fill="none" stroke="#00f2fe" stroke-width="1" d="M 0 375 Q 200 390 400 370 T 800 375 T 1200 370" opacity=".2"/><rect width="700" height="250" x="250" y="70" fill="#050814" fill-opacity=".65" stroke="url(#accent-grad)" stroke-width="1.5" filter="url(#soft-glow)" rx="20"/><g text-anchor="middle"><g transform="translate(600, 115)"><rect width="260" height="30" x="-130" y="-16" fill="#7000ff" fill-opacity=".3" stroke="#00f2fe" stroke-width="1" rx="15"/><text x="0" y="4" fill="#00f2fe" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">🛰️ SPACE OPS &amp; GSaaS 📡</text></g><text x="600" y="185" fill="url(#title-grad)" filter="url(#glow)" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="42" font-weight="900" letter-spacing="1">Awesome Satellite GSaaS</text><text x="600" y="230" fill="#e0e6ed" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing=".5">Ground Station as a Service &amp; Space Operations Ecosystem</text><text x="600" y="270" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing=".8">CLOUD GSaaS PLATFORMS • MISSION CONTROL • SDR • TELEMETRY • ORBIT TRACKING</text></g></svg>